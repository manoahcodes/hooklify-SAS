{% extends "base.html" %}
{% block head_title %}{{ block.super }} - Payment Verfication {% endblock head_title %} 
{% block content %}
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#ec1313",
              "background-light": "#f8f6f6",
              "background-dark": "#221010",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
  </script>

{% if not is_subscription_activated %}
<div id="pending-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm">

      <!-- SPINNER -->
    <div class="animate-spin rounded-full h-16 w-16 border-4 border-gray-200 border-t-primary mb-6"></div>

      <!-- MESSAGE -->
    <p class="text-white text-center text-lg font-medium px-6">
        Your payment has been confirmed.
        <br>
        We're just verifying your subscription with Paddle...
    </p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var pollUrl = "{% url 'subscription_status' %}?price_uuid={{ pending_price_uuid }}";
    var successUrl = "{% url 'home' %}";

    startStatusPoll(pollUrl, "pending-overlay", successUrl);
});
</script>
{% endif %}
{% endblock content %}
