{% if messages %}
  {% for m in messages %}
    {% if forloop.last %}
      {% with level=m.tags %}
      <div class="fixed bottom-8 right-8 z-50 w-96 pointer-events-none">
        <div
          class="toast pointer-events-auto relative rounded-xl overflow-hidden group hover:scale-[1.02] transition-transform
          {% if 'error' in level %}
            bg-[#1a0f0f] border border-red-500/40
          {% elif 'success' in level %}
            bg-[#0f1a0f] border border-green-500/40
          {% elif 'warning' in level %}
            bg-[#1a160f] border border-yellow-500/40
          {% else %}
            bg-[#0f131a] border border-blue-500/40
          {% endif %}
          "
        >
          <div class="p-4 flex items-start gap-3">
            <div class="p-2 rounded-lg shrink-0
              {% if 'error' in level %}
                bg-red-500/10 text-red-500
              {% elif 'success' in level %}
                bg-green-500/10 text-green-500
              {% elif 'warning' in level %}
                bg-yellow-500/10 text-yellow-500
              {% else %}
                bg-blue-500/10 text-blue-500
              {% endif %}
              ">

              <span>
                {% if 'error' in level %}
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fb2c36">
                    <path d="m40-120 440-760 440 760H40Zm138-80h604L480-720 178-200Zm302-40q17 0 28.5-11.5T520-280q0-17-11.5-28.5T480-320q-17 0-28.5 11.5T440-280q0 17 11.5 28.5T480-240Zm-40-120h80v-200h-80v200Zm40-100Z"/>
                  </svg>
                {% elif 'success' in level %}
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#00c950">
                    <path d="m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
                  </svg>
                {% elif 'warning' in level %}
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#f0b100">
                    <path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
                  </svg>
                {% else %}
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#2b7fff">
                    <path d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
                  </svg>
                {% endif %}
              </span>
            </div>

            <div class="flex-1 pt-1">
              <h4 class="text-sm font-bold text-white leading-none mb-1 capitalize">
                {{ m.level_tag }}
              </h4>
              <p class="text-xs text-white/60 font-medium">
                {{ m }}
              </p>
            </div>

            <button type="button" class="toast-close text-white/20 hover:text-white transition-colors">
              <span class="text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff">
                  <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
                </svg>
              </span>
            </button>
          </div>

          <div class="absolute bottom-0 left-0 w-full h-1 bg-white/5">
            <div
              class="h-full w-full
              {% if 'error' in level %}
                bg-red-500
              {% elif 'success' in level %}
                bg-green-500
              {% elif 'warning' in level %}
                bg-yellow-500
              {% else %}
                bg-blue-500
              {% endif %}
              "
            ></div>
          </div>
        </div>
      </div>
      {% endwith %}
    {% endif %}
  {% endfor %}
{% endif %}
