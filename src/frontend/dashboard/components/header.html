<header class="sticky top-0 z-50 flex items-center justify-between whitespace-nowrap bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-6 py-4">
    
    <div class="flex items-start gap-3 text-[#111418] dark:text-white group cursor-pointer">
        <h2 class="text-lg font-bold leading-tight tracking-[-0.015em] font-display group-hover:text-primary transition-colors">
            Dashboard
        </h2>
    </div>

    <div class="absolute start-0 flex flex-col items-center gap-2 lg:start-1/2 ltr:-translate-x-1/2 rtl:translate-x-1/2">
        <div class="hidden lg:block">
            <div class="flex items-center gap-1 rounded-full text-sm font-medium bg-primary text-primary">
                <a href="{% url "plans" %}" class="flex items-center rounded-full text-sm gap-1 bg-transparent hover:bg-red-600 text-white ps-2.5 text-current focus:outline-none py-2 pe-3">
                    Upgrade to Creator
                </a>
            </div>
        </div>
    </div>

    <div class="flex gap-3 items-center justify-center overflow-x-hidden">
        <div class="shrink-0"></div>

        <div class="flex items-center justify-end gap-2 overflow-x-hidden">
            <div class="flex items-center">

                <button class="flex cursor-pointer items-center justify-center rounded-full overflow-hidden h-9 w-9 px-6 hover:text-red-500 text-white">
                    <span>
                        <i class="fa-regular fa-bell"></i>
                    </span>
                </button>

                <button class="flex cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-6 bg-primary text-sm font-bold leading-normal tracking-[0.015em] transition-all">
                    <span class="truncate">50 Credits Left</span>
                </button>

            </div>
        </div>

    </div>

</header>
