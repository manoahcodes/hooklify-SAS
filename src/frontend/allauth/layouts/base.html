<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}Hooklify{% endblock title %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f91f1f",
              "background-light": "#f8f5f5",
              "background-dark": "#230f0f",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"],
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            boxShadow: {
                "glow": "0 0 20px rgba(249, 31, 31, 0.5)",
                "glow-hover": "0 0 30px rgba(249, 31, 31, 0.7)",
            }
          },
        },
      }
    </script>

    <style>
        .text-glow {
            text-shadow: 0 0 10px rgba(249, 31, 31, 0.3);
        }
    </style>
</head>
<body class="relative flex h-auto min-h-screen justify-center w-full flex-col bg-background-light dark:bg-background-dark text-[#111418] dark:text-white font-body overflow-x-hidden selection:bg-primary selection:text-white">
    {% block content %}
    {% endblock %}
</body>
</html>
