<header class="sticky top-0 z-50 flex items-center justify-between whitespace-nowrap border-b border-solid border-[#3a2727]/30 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-6 py-4 lg:px-40">
  <div class="flex items-center gap-3 text-[#111418] dark:text-white group cursor-pointer">
    <div class="size-8 flex items-center justify-center rounded-lg bg-primary text-white shadow-glow">
      <span class="material-symbols-outlined text-[20px] font-bold">bolt</span>
    </div>

    <a href="{% url 'home' %}">
      <h2 class="text-lg font-bold leading-tight tracking-[-0.015em] font-display group-hover:text-primary transition-colors">
        Hooklify
      </h2>
    </a>
  </div>

  <div class="hidden md:flex flex-1 justify-end gap-8 items-center">
    <div class="flex items-center gap-9">
      <a
        class="text-sm font-medium leading-normal hover:text-primary transition-colors"
        href="#">Features</a>
      <a
        class="text-sm font-medium leading-normal hover:text-primary transition-colors"
        href="{% url "plans" %}">Pricing</a>
      {% comment %} <a
        class="text-sm font-medium leading-normal hover:text-primary transition-colors"
        href="#">Demo</a> {% endcomment %}
    </div>

    <div class="flex gap-3">
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'account_logout' %}" class="inline">
                {% csrf_token %}
                <button
                    class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-6 bg-transparent border border-[#3a2727] hover:border-white text-sm font-bold leading-normal tracking-[0.015em] transition-all">
                    <span class="truncate">Logout</span>
                </button>
            </form>
        {% else %}
                <a
                  href="{% url "account_login" %}"
                  class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-6 bg-transparent border border-[#3a2727] hover:border-white text-sm font-bold leading-normal tracking-[0.015em] transition-all">
                  <span class="truncate">Login</span>
                </a>
        {% endif %}

        {% if user.is_authenticated %}
            <a href="{% url 'home' %}">
                {% csrf_token %}
                <button
                    class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-6 bg-primary hover:bg-red-600 shadow-glow hover:shadow-glow-hover text-white text-sm font-bold leading-normal tracking-[0.015em] transition-all transform hover:scale-105">
                    <span class="truncate">Dashboard</span>
                </button>
            </a>
        {% else %}
                <a
                    href="{% url "account_signup" %}"
                    class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-6 bg-primary hover:bg-red-600 shadow-glow hover:shadow-glow-hover text-white text-sm font-bold leading-normal tracking-[0.015em] transition-all transform hover:scale-105">
                    <span class="truncate">Get Started</span>
                </a>
        {% endif %}
    </div>

  </div>
  <!-- Mobile Menu Icon -->
  <button class="md:hidden flex items-center justify-center text-white">
    <span class="material-symbols-outlined">menu</span>
  </button>
</header>
