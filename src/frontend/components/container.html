{% load i18n %}
<div class="container mx-auto pt-6">
    <div class="w-11/12 mx-auto mt-6 lg:w-5/12 xl:w-4/12 rounded-2xl p-8 bg-background-light dark:bg-background-dark">
        <div class="text-center">
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-100 mb-4">
                {{ heading }}
            </h1>
        </div>

        {% if subheading %}
            <div class="text-center text-gray-400 mb-4">
                {{ subheading }}
            </div>
        {% endif %}

        <div class="text-gray-200">
            {{ children }}
        </div>
    </div>
</div>
