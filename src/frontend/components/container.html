{% load i18n %}
<div class="container pt-1 mx-auto">
    <div class="rounded-2xl border border-gray-700 bg-gray-900 p-8 shadow-sm w-11/12 p-10 mx-auto mt-5 rounded-lg shadow-md lg:w-5/12 xl:w-4/12 bg-base-100">
        <div class="text-center">
            <h1 class="text-3xl mb-5 font-bold tracking-tight text-gray-100">{{ heading }}</h1>
        </div>
        {% if subheading %}
            <div class="text-center mb-2 text-gray-400">{{ subheading }}</div>
        {% endif %}
        <div class="text-gray-200">
            {{ children }}
        </div>
    </div>
</div>
